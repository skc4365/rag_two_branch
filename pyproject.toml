[project]
name = "rag-two-branch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "skc4365", email = "50658047+skc4365@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.2",
    # Ragas 0.4.3 still imports the legacy VertexAI module present in 0.3.31.
    "langchain-community==0.3.31",
    "langchain-openai>=1.6.6",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "ragas==0.4.3",
]

[project.scripts]
rag-two-branch = "rag_two_branch:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
